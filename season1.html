<!DOCTYPE html>
<html>
<head>
    <title>VAEL — The Eclipsed</title>

    <style>
        body {
    background-color: black;
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at center, #111 0%, black 70%);
}

        h1 {
    font-size: 55px;
    letter-spacing: 8px;
    margin-top: 100px;
    animation: fadeIn 2s ease-in;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

        .subtitle {
            font-size: 20px;
            letter-spacing: 3px;
        }

        .teaser {
    font-size: 18px;
    margin-top: 50px;
    opacity: 0;
    animation: teaserIn 2s ease-in forwards;
    animation-delay: 1.5s;
}

@keyframes teaserIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

        .chapters {
    font-size: 22px;
    margin-top: 40px;
    letter-spacing: 4px;
    opacity: 0.8;
}

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            letter-spacing: 2px;
        }
        .back-button {
    transition: 0.3s;
}

.back-button:hover {
    background-color: white;
    color: black;
    box-shadow: 0 0 20px white;
}
.signature {
    margin-top: 70px;
    font-size: 12px;
    letter-spacing: 6px;
    opacity: 0.4;
}
.divider {
    width: 60px;
    height: 1px;
    background-color: white;
    margin: 25px auto;
    opacity: 0.4;
}
    </style>
</head>

<body>

    <h1>THE ECLIPSED</h1>

    <div class="subtitle">VAEL — SEASON 1</div>

    <div class="teaser">
        The story begins in Brook...
    </div>

    <div class="chapters">
        25 CHAPTERS
    </div>
<div class="divider"></div>
    <p>COMING SOON</p>

    <a class="back-button" href="index.html">← BACK TO VAEL</a>
<p class="signature">VAEL 👁️</p>
</body>
</html>
